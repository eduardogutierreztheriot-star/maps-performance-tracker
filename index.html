    <script>
        /* Resolve the theme before first paint to avoid a flash. */
        (function () {
            var pref = 'system';
            try {
                var data = JSON.parse(localStorage.getItem('maps.v2') || 'null');
                pref = (data && data.settings && data.settings.theme) || localStorage.getItem('theme') || 'dark';
            } catch (e) { /* storage unavailable */ }
            var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>
